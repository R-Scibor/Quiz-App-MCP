[project]
name = "quiz-authoring-mcp"
version = "0.1.0"
description = "MCP server for Quiz-App authoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.9.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
]

[project.scripts]
quiz-authoring-mcp = "quiz_authoring_mcp.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
